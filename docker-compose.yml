services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: grievx
      POSTGRES_USER: grievx
      POSTGRES_PASSWORD: grievx_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grievx -d grievx"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  s3:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -volume.max=0 -master.volumeSizeLimitMB=1024 -s3
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - s3_data:/data

volumes:
  postgres_data:
  redis_data:
  s3_data:
